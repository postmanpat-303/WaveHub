name: macOS

# Universal (Apple Silicon + Intel) "Wave Hub.app", ad-hoc signed, as a .dmg and a .zip.
# Run it by hand (Actions > macOS > Run workflow). With release_tag set, the two files are
# attached to that release and their checksums are added to its SHA256SUMS.txt.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the dmg/zip to this release tag (e.g. v0.2.0); empty = artifacts only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: ver
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Wave Hub $VER"

      - name: Tests
        run: cargo test --locked --release

      - name: Build and package (universal .app, dmg, zip)
        run: scripts/package-macos.sh "${{ steps.ver.outputs.ver }}"

      - name: Smoke test (both halves of the universal program)
        run: |
          BIN="dist/Wave Hub.app/Contents/MacOS/WaveHub"
          lipo -archs "$BIN"
          "$BIN" --version
          "$BIN" --update-info
          arch -x86_64 "$BIN" --version || echo "::warning::Rosetta not available for the x86_64 half"

      - name: Smoke test the dmg (mount, check contents)
        run: |
          VER=${{ steps.ver.outputs.ver }}
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "dist/v$VER/WaveHub-$VER-macos-universal.dmg"
          ls -la "$MNT"
          test -L "$MNT/Applications"
          plutil -p "$MNT/Wave Hub.app/Contents/Info.plist"
          codesign --verify --deep --strict "$MNT/Wave Hub.app"
          "$MNT/Wave Hub.app/Contents/MacOS/WaveHub" --version
          hdiutil detach "$MNT"

      - name: Headless launch (10 s, must still be running)
        run: |
          "dist/Wave Hub.app/Contents/MacOS/WaveHub" > "$RUNNER_TEMP/run.log" 2>&1 &
          PID=$!
          sleep 10
          screencapture -x "$RUNNER_TEMP/macos-launch.png" || true
          if kill -0 $PID; then echo "still running after 10 s"; kill $PID; else echo "app exited early"; cat "$RUNNER_TEMP/run.log"; exit 1; fi
          cat "$RUNNER_TEMP/run.log"

      - uses: actions/upload-artifact@v4
        with:
          name: WaveHub-${{ steps.ver.outputs.ver }}-macos-universal
          path: |
            dist/v*/WaveHub-*-macos-universal.dmg
            dist/v*/WaveHub-*-macos-universal.zip
            ${{ runner.temp }}/macos-launch.png

      - name: Attach to the release and update SHA256SUMS.txt
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          VER=${{ steps.ver.outputs.ver }}
          test "$TAG" = "v$VER" || { echo "tag $TAG does not match Cargo version $VER"; exit 1; }
          cd "dist/v$VER"
          gh release upload "$TAG" --clobber "WaveHub-$VER-macos-universal.dmg" "WaveHub-$VER-macos-universal.zip"
          gh release download "$TAG" --pattern SHA256SUMS.txt --clobber
          grep -v -- '-macos-universal\.' SHA256SUMS.txt > sums.new || true
          shasum -a 256 "WaveHub-$VER-macos-universal.dmg" "WaveHub-$VER-macos-universal.zip" >> sums.new
          sort -k2 sums.new > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" --clobber SHA256SUMS.txt
