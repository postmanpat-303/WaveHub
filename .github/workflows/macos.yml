name: macOS

# Universal (Apple Silicon + Intel) "Wave Hub.app", ad-hoc signed, as a .dmg and a .zip.
# Run it by hand (Actions > macOS > Run workflow). With release_tag set, the two files are
# attached to that release and their checksums are added to its SHA256SUMS.txt.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the dmg/zip to this release tag (e.g. v0.2.0); empty = artifacts only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: ver
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Wave Hub $VER"

      - name: Tests
        run: cargo test --locked --release

      - name: Build and package (universal .app, dmg, zip)
        run: scripts/package-macos.sh "${{ steps.ver.outputs.ver }}"

      - name: Smoke test (both halves of the universal program)
        run: |
          BIN="dist/Wave Hub.app/Contents/MacOS/WaveHub"
          lipo -archs "$BIN"
          "$BIN" --version
          "$BIN" --update-info
          arch -x86_64 "$BIN" --version || echo "::warning::Rosetta not available for the x86_64 half"

      - name: Smoke test the dmg (mount, check contents)
        run: |
          VER=${{ steps.ver.outputs.ver }}
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "dist/v$VER/WaveHub-$VER-macos-universal.dmg"
          ls -la "$MNT"
          test -L "$MNT/Applications"
          plutil -p "$MNT/Wave Hub.app/Contents/Info.plist"
          codesign --verify --deep --strict "$MNT/Wave Hub.app"
          "$MNT/Wave Hub.app/Contents/MacOS/WaveHub" --version
          hdiutil detach "$MNT"

      - name: Headless launch (10 s, must still be running)
        run: |
          "dist/Wave Hub.app/Contents/MacOS/WaveHub" > "$RUNNER_TEMP/run.log" 2>&1 &
          PID=$!
          sleep 10
          screencapture -x "$RUNNER_TEMP/macos-launch.png" || true
          if kill -0 $PID; then echo "still running after 10 s"; kill $PID; else echo "app exited early"; cat "$RUNNER_TEMP/run.log"; exit 1; fi
          cat "$RUNNER_TEMP/run.log"

      - name: Install ChipWave Studio from its real release, launch it, remove it
        run: |
          BIN="$PWD/dist/Wave Hub.app/Contents/MacOS/WaveHub"
          APP="$HOME/Applications/ChipWave.app"
          "$BIN" --install chipwave-tracker | tee "$RUNNER_TEMP/cw-install.log"
          grep -q "Installed ChipWave Studio" "$RUNNER_TEMP/cw-install.log"
          test -x "$APP/Contents/MacOS/ChipWave"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundleExecutable|CFBundleShortVersionString'
          lipo -archs "$APP/Contents/MacOS/ChipWave" || true
          codesign -dv "$APP" 2>&1 || true
          "$BIN" --list-apps | tee "$RUNNER_TEMP/cw-list.log"
          grep -q "chipwave-tracker: .*Applications/ChipWave.app" "$RUNNER_TEMP/cw-list.log"
          open "$APP"
          sleep 12
          screencapture -x "$RUNNER_TEMP/chipwave-launch.png" || true
          if pgrep -f "ChipWave.app/Contents/MacOS/ChipWave"; then echo "ChipWave is running"; else echo "ChipWave did not start"; log show --last 2m --predicate 'process == "ChipWave"' | tail -40 || true; exit 1; fi
          pkill -f "ChipWave.app/Contents/MacOS/ChipWave" || true
          sleep 3
          "$BIN" --uninstall chipwave-tracker
          test ! -e "$APP"
          "$BIN" --list-apps | grep -q "chipwave-tracker: not installed"

      - name: BigWave Radio and StreamWave (checksum-checked installs, StreamWave launched)
        run: |
          BIN="$PWD/dist/Wave Hub.app/Contents/MacOS/WaveHub"
          "$BIN" --install bigwave-radio 2>&1 | tee "$RUNNER_TEMP/bw.log"
          grep -q Verifying "$RUNNER_TEMP/bw.log"
          test -d "$HOME/Applications/BigWave Radio.app"
          "$BIN" --uninstall bigwave-radio
          test ! -e "$HOME/Applications/BigWave Radio.app"
          SW="$HOME/Applications/StreamWave.app"
          "$BIN" --install streamwave 2>&1 | tee "$RUNNER_TEMP/sw.log"
          grep -q Verifying "$RUNNER_TEMP/sw.log"
          test -x "$SW/Contents/MacOS/StreamWave"
          open "$SW"
          sleep 15
          screencapture -x "$RUNNER_TEMP/streamwave-launch.png" || true
          pgrep -f "StreamWave.app/Contents/MacOS/StreamWave" || { echo "StreamWave did not start"; exit 1; }
          pkill -f "StreamWave.app/Contents/MacOS/StreamWave" || true
          sleep 3
          "$BIN" --uninstall streamwave
          test ! -e "$SW"
          "$BIN" --list-apps | grep -q "streamwave: not installed"

      - name: A ChipWave copy renamed to "ChipWave Studio.app" is still found
        run: |
          BIN="$PWD/dist/Wave Hub.app/Contents/MacOS/WaveHub"
          "$BIN" --install chipwave-tracker
          mv "$HOME/Applications/ChipWave.app" "$HOME/Applications/ChipWave Studio.app"
          rm -rf "$HOME/Library/Application Support/WaveHub/installed.json"
          "$BIN" --list-apps | tee "$RUNNER_TEMP/cws.log"
          grep -q "chipwave-tracker: .*ChipWave Studio.app" "$RUNNER_TEMP/cws.log"
          rm -rf "$HOME/Applications/ChipWave Studio.app"

      - name: Upgrade from the published 0.2.5 app (installed apps kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ steps.ver.outputs.ver }}
          T="$RUNNER_TEMP/up"; mkdir -p "$T"
          gh release download v0.2.5 -R postmanpat-303/WaveHub --pattern 'WaveHub-0.2.5-macos-universal.zip' -D "$T"
          ditto -x -k "$T/WaveHub-0.2.5-macos-universal.zip" "$HOME/Applications"
          OLD="$HOME/Applications/Wave Hub.app/Contents/MacOS/WaveHub"
          "$OLD" --version
          "$OLD" --install bigwave-radio
          rm -rf "$HOME/Applications/Wave Hub.app"
          ditto -x -k "dist/v$VER/WaveHub-$VER-macos-universal.zip" "$HOME/Applications"
          NEW="$HOME/Applications/Wave Hub.app/Contents/MacOS/WaveHub"
          "$NEW" --version | grep -F "$VER"
          plutil -p "$HOME/Applications/Wave Hub.app/Contents/Info.plist" | grep -E 'CFBundleIdentifier|Copyright'
          "$NEW" --list-apps | tee "$T/list.txt"
          grep -q "bigwave-radio: 0" "$T/list.txt"
          "$NEW" --uninstall bigwave-radio
          rm -rf "$HOME/Applications/Wave Hub.app"
          echo "upgrade from 0.2.5 OK"

      - uses: actions/upload-artifact@v4
        with:
          name: WaveHub-${{ steps.ver.outputs.ver }}-macos-universal
          path: |
            dist/v*/WaveHub-*-macos-universal.dmg
            dist/v*/WaveHub-*-macos-universal.zip
            ${{ runner.temp }}/macos-launch.png
            ${{ runner.temp }}/chipwave-launch.png
            ${{ runner.temp }}/streamwave-launch.png

      - name: Attach to the release and update SHA256SUMS.txt
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          VER=${{ steps.ver.outputs.ver }}
          test "$TAG" = "v$VER" || { echo "tag $TAG does not match Cargo version $VER"; exit 1; }
          cd "dist/v$VER"
          cp "WaveHub-$VER-macos-universal.dmg" "WaveHub-macos-universal.dmg"
          cp "WaveHub-$VER-macos-universal.zip" "WaveHub-macos-universal.zip"
          gh release upload "$TAG" --clobber "WaveHub-$VER-macos-universal.dmg" "WaveHub-$VER-macos-universal.zip" "WaveHub-macos-universal.dmg" "WaveHub-macos-universal.zip"
          gh release download "$TAG" --pattern SHA256SUMS.txt --clobber
          grep -v -- '-macos-universal\.' SHA256SUMS.txt > sums.new || true
          shasum -a 256 "WaveHub-$VER-macos-universal.dmg" "WaveHub-$VER-macos-universal.zip" "WaveHub-macos-universal.dmg" "WaveHub-macos-universal.zip" >> sums.new
          sort -k2 sums.new > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" --clobber SHA256SUMS.txt
