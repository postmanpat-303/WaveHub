name: Windows

# Windows x64 with Microsoft's toolchain (x86_64-pc-windows-msvc), C runtime linked in
# (+crt-static), so WaveHub.exe needs no extra DLLs. Produces:
#   WaveHub-<v>-setup-x64.exe     NSIS per-machine setup (installer/wavehub.nsi)
#   WaveHub-<v>-windows-x64.zip   portable
#   WaveHub.exe                   the bare program, for 0.1.0's update link
# Run it by hand (Actions > Windows > Run workflow). With release_tag set, the files are
# attached to that release and SHA256SUMS.txt is updated; empty = artifacts only.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the files to this release tag (e.g. v0.2.1); empty = artifacts only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Version
        id: ver
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "ver=$v" >> $env:GITHUB_OUTPUT
          "Wave Hub $v"

      - name: Tests
        run: cargo test --locked --release --target x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Check the program (no extra DLLs, version info, manifest)
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\wave-hub.exe"
          $deps = dumpbin /nologo /dependents $exe | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
          $deps
          $bad = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|libunwind|libgcc|libwinpthread|ucrtbase)' }
          if ($bad) { throw "unexpected DLLs: $bad" }
          $vi = (Get-Item $exe).VersionInfo
          $vi | Format-List FileDescription, ProductName, CompanyName, FileVersion, OriginalFilename, LegalCopyright
          if ($vi.FileDescription -ne "Wave Hub") { throw "version info missing" }
          $m = Select-String -Path $exe -Pattern 'requestedExecutionLevel level="asInvoker"' -SimpleMatch -Encoding ascii
          if (-not $m) { throw "manifest missing" }
          "manifest: asInvoker"

      - name: Package (zip + NSIS setup)
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          $out = "dist\v$v"; New-Item -ItemType Directory -Force $out, dist\pkg | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\wave-hub.exe dist\pkg\WaveHub.exe
          (Get-Content packaging\windows-README.txt | Select-Object -Skip 1) | Set-Variable rest
          @("Wave Hub $v - Windows x64") + $rest | Set-Content dist\pkg\README.txt
          Copy-Item LICENSE dist\pkg\LICENSE.txt
          Copy-Item assets\fonts\OFL-Poppins.txt dist\pkg\OFL-Poppins.txt
          Compress-Archive -Path dist\pkg\WaveHub.exe, dist\pkg\README.txt, dist\pkg\LICENSE.txt, dist\pkg\OFL-Poppins.txt -DestinationPath "$out\WaveHub-$v-windows-x64.zip" -CompressionLevel Optimal
          Copy-Item dist\pkg\WaveHub.exe "$out\WaveHub.exe"
          choco install nsis -y --no-progress | Out-Null
          $parts = $v.Split('.') + @('0','0','0','0')
          $vi = ($parts[0..3] -join '.')
          Push-Location installer
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 "/DVERSION=$v" "/DVIVERSION=$vi" "/DPKGDIR=..\dist\pkg" "/DOUTFILE=..\$out\WaveHub-$v-setup-x64.exe" wavehub.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Pop-Location
          Get-ChildItem $out | Format-Table Name, Length

      - name: Icons (small sizes stored as BMP, so Explorer shows the elephant)
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          python -m pip install --quiet pefile
          python scripts/check-ico.py assets/icons/wavehub.ico "dist\v$v\WaveHub.exe" "dist\v$v\WaveHub-$v-setup-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw "an icon has PNG small frames" }
          $p = Start-Process "dist\v$v\WaveHub-$v-setup-x64.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\Wave Hub"
          python scripts/check-ico.py "$dir\WaveHub.exe" "$dir\Uninstall.exe"
          if ($LASTEXITCODE -ne 0) { throw "an installed icon has PNG small frames" }
          (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WaveHub').DisplayIcon

      - name: Explorer screenshot of the downloads (information only)
        continue-on-error: true
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          $show = Join-Path $env:RUNNER_TEMP 'icons'
          New-Item -ItemType Directory -Force $show | Out-Null
          Copy-Item "dist\v$v\WaveHub.exe", "dist\v$v\WaveHub-$v-setup-x64.exe", "$env:ProgramFiles\Wave Hub\Uninstall.exe" $show
          # Medium icons in this folder: Explorer reads the 48 px frame; the details pane uses 16 px.
          $shell = New-Object -ComObject Shell.Application
          Start-Process explorer.exe $show
          Start-Sleep 6
          foreach ($w in $shell.Windows()) { try { if ($w.Document.Folder.Self.Path -eq $show) { $w.Document.CurrentViewMode = 1; $w.Document.IconSize = 48 } } catch {} }
          Start-Sleep 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\explorer-icons.png")
          foreach ($w in $shell.Windows()) { try { if ($w.Document.Folder.Self.Path -eq $show) { $w.Document.CurrentViewMode = 4 } } catch {} }
          Start-Sleep 3
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\explorer-details.png")
          Start-Process "$env:ProgramFiles\Wave Hub\Uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep 4

      - name: Smoke test the portable zip (exe alone, no DLLs next to it)
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          $t = Join-Path $env:RUNNER_TEMP portable
          Expand-Archive "dist\v$v\WaveHub-$v-windows-x64.zip" $t
          $p = Start-Process "$t\WaveHub.exe" -ArgumentList '--update-info' -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$t\info.txt"
          Get-Content "$t\info.txt"
          if (-not (Select-String "$t\info.txt" -Pattern 'installed as: Windows portable' -Quiet)) { throw "portable not detected" }

      - name: Links open through ShellExecuteW (a test URL handler records what it was given)
        env:
          WAVEHUB_TEST_LINKS: "1"
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          $rec = Join-Path $env:RUNNER_TEMP 'record-link.ps1'
          $got = Join-Path $env:RUNNER_TEMP 'wavehub-link.txt'
          "Set-Content -Path '$got' -Value `$args[0]" | Set-Content $rec
          $k = 'HKCU:\Software\Classes\wavehub-test'
          New-Item -Force "$k\shell\open\command" | Out-Null
          Set-ItemProperty $k -Name '(default)' -Value 'URL:Wave Hub link test'
          Set-ItemProperty $k -Name 'URL Protocol' -Value ''
          Set-ItemProperty "$k\shell\open\command" -Name '(default)' -Value "powershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$rec`" `"%1`""
          $url = 'wavehub-test://check/discussions?a=1&b=2'
          $p = Start-Process "dist\v$v\WaveHub.exe" -ArgumentList '--open-url', "`"$url`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WaveHub.exe --open-url exit $($p.ExitCode)" }
          for ($i = 0; $i -lt 30 -and -not (Test-Path $got); $i++) { Start-Sleep 1 }
          $seen = (Get-Content $got -Raw).Trim()
          "handler got: $seen"
          if ($seen -notlike 'wavehub-test://check/discussions?a=1&b=2*') { throw "the link arrived changed: $seen" }
          Remove-Item -Recurse $k

      - name: Smoke test the setup (silent per-machine install, launch, uninstall)
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          $p = Start-Process "dist\v$v\WaveHub-$v-setup-x64.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\Wave Hub"
          Get-ChildItem $dir | Format-Table Name, Length
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Wave Hub\Wave Hub.lnk")) { throw "no Start menu shortcut" }
          Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WaveHub' | Format-List DisplayName, DisplayVersion, Publisher, DisplayIcon
          Start-Process "$dir\WaveHub.exe" -ArgumentList '--update-info' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\info2.txt"
          Get-Content "$env:RUNNER_TEMP\info2.txt"
          if (-not (Select-String "$env:RUNNER_TEMP\info2.txt" -Pattern 'installed as: Windows setup' -Quiet)) { throw "setup not detected" }
          $err = "$env:RUNNER_TEMP\gui-err.txt"
          $app = Start-Process "$dir\WaveHub.exe" -PassThru -RedirectStandardError $err
          Start-Sleep 10
          if ($app.HasExited) {
            $msg = Get-Content $err -Raw
            "exited early ($($app.ExitCode)): $msg"
            # GitHub's Windows runners have no GPU, only Windows' OpenGL 1.1, which egui can't use.
            if ($msg -match 'OpenGL|opengl|glutin|pixel format|GL context|NoAvailablePixelFormat|wgl') {
              "::warning::No usable OpenGL on this runner, so the window couldn't open here (expected on GitHub's Windows runners)."
            } else { throw "Wave Hub exited early" }
          } else {
            "still running after 10 s"
            Stop-Process $app
          }
          Start-Sleep 2
          Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep 5
          if (Test-Path "$dir\WaveHub.exe") { throw "uninstall left the program behind" }
          "uninstalled"

      - name: Install the three apps from their real releases, then remove them
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          $hub = "dist\v$v\WaveHub.exe"
          foreach ($id in 'bigwave-radio', 'chipwave-tracker', 'streamwave') {
            $log = "$env:RUNNER_TEMP\install-$id.txt"
            $p = Start-Process $hub -ArgumentList '--install', $id -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log
            Get-Content $log
            if ($p.ExitCode -ne 0) { throw "$id did not install (exit $($p.ExitCode))" }
          }
          Start-Process $hub -ArgumentList '--list-apps' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\list.txt"
          Get-Content "$env:RUNNER_TEMP\list.txt"
          if (Select-String "$env:RUNNER_TEMP\list.txt" -Pattern 'not installed' -Quiet) { throw "an app is missing from the list" }
          foreach ($id in 'streamwave', 'chipwave-tracker', 'bigwave-radio') {
            $log = "$env:RUNNER_TEMP\remove-$id.txt"
            $p = Start-Process $hub -ArgumentList '--uninstall', $id -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log
            Get-Content $log
            if ($p.ExitCode -ne 0) { throw "$id did not uninstall (exit $($p.ExitCode))" }
          }

      - name: Portable installs get Start menu and Desktop shortcuts, and uninstall removes them
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          $hub = "dist\v$v\WaveHub.exe"
          $programs = [Environment]::GetFolderPath('Programs')
          $desktop = [Environment]::GetFolderPath('Desktop')
          $sh = New-Object -ComObject WScript.Shell
          $apps = @{ 'bigwave-radio' = 'BigWave Radio'; 'chipwave-tracker' = 'ChipWave Studio' }
          foreach ($id in $apps.Keys) {
            $name = $apps[$id]
            $p = Start-Process $hub -ArgumentList '--install', $id -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\sc-$id.txt"
            Get-Content "$env:RUNNER_TEMP\sc-$id.txt"
            if ($p.ExitCode -ne 0) { throw "$id did not install (exit $($p.ExitCode))" }
            foreach ($place in $programs, $desktop) {
              $lnk = Join-Path $place "$name.lnk"
              if (-not (Test-Path -LiteralPath $lnk)) { throw "no shortcut $lnk" }
              $s = $sh.CreateShortcut($lnk)
              "$lnk -> $($s.TargetPath) (in $($s.WorkingDirectory), icon $($s.IconLocation))"
              if (-not (Test-Path -LiteralPath $s.TargetPath)) { throw "$lnk points at a missing program" }
              if ($s.TargetPath -notlike "$env:LOCALAPPDATA\WaveHub\apps\$id\*") { throw "$lnk points somewhere else" }
              if ($s.WorkingDirectory -ne (Split-Path $s.TargetPath)) { throw "$lnk has the wrong start folder" }
            }
          }
          $json = "$env:LOCALAPPDATA\WaveHub\installed.json"
          Get-Content $json
          # Repair (installs from 0.2.6 and older): no shortcuts and no flag -> made once.
          $j = Get-Content $json -Raw | ConvertFrom-Json
          $j.apps.'bigwave-radio'.shortcuts_done = $false
          $j | ConvertTo-Json -Depth 5 | Set-Content $json
          Remove-Item (Join-Path $programs 'BigWave Radio.lnk'), (Join-Path $desktop 'BigWave Radio.lnk')
          Start-Process $hub -ArgumentList '--repair-shortcuts' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\sc-repair.txt"
          Get-Content "$env:RUNNER_TEMP\sc-repair.txt"
          foreach ($place in $programs, $desktop) { if (-not (Test-Path -LiteralPath (Join-Path $place 'BigWave Radio.lnk'))) { throw "repair didn't make the shortcut in $place" } }
          # A shortcut the user deletes afterwards isn't put back (not on start, not on update).
          Remove-Item (Join-Path $desktop 'BigWave Radio.lnk')
          Start-Process $hub -ArgumentList '--repair-shortcuts' -Wait -NoNewWindow
          Start-Process $hub -ArgumentList '--install', 'bigwave-radio' -Wait -NoNewWindow
          if (Test-Path -LiteralPath (Join-Path $desktop 'BigWave Radio.lnk')) { throw "the deleted Desktop shortcut came back" }
          if (-not (Test-Path -LiteralPath (Join-Path $programs 'BigWave Radio.lnk'))) { throw "the update lost the Start menu shortcut" }
          foreach ($id in $apps.Keys) {
            $p = Start-Process $hub -ArgumentList '--uninstall', $id -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\sc-rm-$id.txt"
            Get-Content "$env:RUNNER_TEMP\sc-rm-$id.txt"
            if ($p.ExitCode -ne 0) { throw "$id did not uninstall (exit $($p.ExitCode))" }
            foreach ($place in $programs, $desktop) {
              $lnk = Join-Path $place "$($apps[$id]).lnk"
              if (Test-Path -LiteralPath $lnk) { throw "uninstall left $lnk behind" }
            }
          }
          "shortcuts OK"

      - name: ChipWave Studio installed with its own setup is found and removed (publisher Del (postmanpat))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          $hub = "dist\v$v\WaveHub.exe"
          $tag = gh release view -R postmanpat-303/ChipWaveStudio --json tagName -q .tagName
          "ChipWave latest: $tag"
          $setup = "$env:RUNNER_TEMP\chipwave-setup.exe"
          gh release download $tag -R postmanpat-303/ChipWaveStudio --pattern "ChipWave-$($tag.TrimStart('v'))-setup-x64.exe" -O $setup
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ChipWave setup exit $($p.ExitCode)" }
          $keys = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ChipWaveTracker', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ChipWaveTracker'
          $k = $keys | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $k) { throw "ChipWave's setup wrote no ChipWaveTracker uninstall entry" }
          Get-ItemProperty $k | Format-List DisplayName, DisplayVersion, Publisher, DisplayIcon, UninstallString
          # After the rename only the display name changes: Wave Hub must still find it.
          Set-ItemProperty $k -Name DisplayName -Value 'ChipWave Studio'
          Start-Process $hub -ArgumentList '--list-apps' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\cw-list.txt"
          Get-Content "$env:RUNNER_TEMP\cw-list.txt"
          if (-not (Select-String "$env:RUNNER_TEMP\cw-list.txt" -Pattern 'chipwave-tracker: 0' -Quiet)) { throw "Wave Hub didn't find ChipWave installed by its setup" }
          $p = Start-Process $hub -ArgumentList '--uninstall', 'chipwave-tracker' -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\cw-remove.txt"
          Get-Content "$env:RUNNER_TEMP\cw-remove.txt"
          if ($p.ExitCode -ne 0) { throw "uninstall exit $($p.ExitCode)" }
          Start-Sleep 3
          if (Test-Path $k) { throw "ChipWave's uninstall entry is still there" }
          "ChipWave setup install found and removed"

      - name: Upgrade from the published 0.2.5 setup (apps and uninstall entry kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          $old = "$env:RUNNER_TEMP\old-setup.exe"
          gh release download v0.2.5 -R postmanpat-303/WaveHub --pattern 'WaveHub-0.2.5-setup-x64.exe' -O $old
          $p = Start-Process $old -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "0.2.5 setup exit $($p.ExitCode)" }
          # 0.2.5 installed per-user, so run that copy first
          $oldDir = "$env:LOCALAPPDATA\Programs\Wave Hub"
          $oldKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WaveHub'
          if (-not (Test-Path "$oldDir\WaveHub.exe")) { throw "0.2.5 did not install per-user as expected" }
          Get-ItemProperty $oldKey | Format-List DisplayName, DisplayVersion, Publisher
          $p = Start-Process "$oldDir\WaveHub.exe" -ArgumentList '--install', 'bigwave-radio' -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\up-install.txt"
          Get-Content "$env:RUNNER_TEMP\up-install.txt"
          if ($p.ExitCode -ne 0) { throw "0.2.5 could not install BigWave Radio" }
          $dir = "$env:ProgramFiles\Wave Hub"
          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WaveHub'
          $p = Start-Process "dist\v$v\WaveHub-$v-setup-x64.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "$v setup exit $($p.ExitCode)" }
          $e = Get-ItemProperty $key
          $e | Format-List DisplayName, DisplayVersion, Publisher, UninstallString
          if ($e.DisplayVersion -ne $v) { throw "uninstall entry still says $($e.DisplayVersion)" }
          if ($e.Publisher -ne 'Del (postmanpat)') { throw "publisher is $($e.Publisher)" }
          $entries = @(Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq 'Wave Hub' })
          if ($entries.Count -ne 1) { throw "expected one Wave Hub uninstall entry, found $($entries.Count)" }
          $leftover = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq 'Wave Hub' })
          if ($leftover.Count -ne 0) { throw "the old per-user uninstall entry is still there" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Wave Hub") { throw "the old per-user folder is still there" }
          Start-Process "$dir\WaveHub.exe" -ArgumentList '--version' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\up-ver.txt"
          Get-Content "$env:RUNNER_TEMP\up-ver.txt"
          if (-not (Select-String "$env:RUNNER_TEMP\up-ver.txt" -Pattern $v -SimpleMatch -Quiet)) { throw "the installed program is not $v" }
          Start-Process "$dir\WaveHub.exe" -ArgumentList '--list-apps' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\up-list.txt"
          Get-Content "$env:RUNNER_TEMP\up-list.txt"
          if (-not (Select-String "$env:RUNNER_TEMP\up-list.txt" -Pattern 'bigwave-radio: 0' -Quiet)) { throw "BigWave Radio was forgotten after the upgrade" }
          Start-Process "$dir\WaveHub.exe" -ArgumentList '--uninstall', 'bigwave-radio' -Wait -NoNewWindow
          Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep 5
          if (Test-Path "$dir\WaveHub.exe") { throw "uninstall left the program behind" }
          if (Test-Path $key) { throw "uninstall left its entry behind" }
          "upgrade from 0.2.5 OK"

      - name: Microsoft Defender scan (information only)
        continue-on-error: true
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (Test-Path $mp) {
            & $mp -SignatureUpdate | Select-Object -Last 2
            foreach ($f in Get-ChildItem "dist\v$v\*") { "== $($f.Name)"; & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation | Select-Object -Last 3 }
          } else { "Defender command-line scanner not found" }

      - uses: actions/upload-artifact@v4
        with:
          name: WaveHub-${{ steps.ver.outputs.ver }}-windows-x64
          path: dist/v*/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-screenshots
          path: ${{ runner.temp }}/explorer-*.png
          if-no-files-found: warn

      - name: Attach to the release and update SHA256SUMS.txt
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          VER=${{ steps.ver.outputs.ver }}
          test "$TAG" = "v$VER" || { echo "tag $TAG does not match Cargo version $VER"; exit 1; }
          cd "dist/v$VER"
          F="WaveHub-$VER-setup-x64.exe WaveHub-$VER-windows-x64.zip WaveHub.exe"
          gh release upload "$TAG" --clobber $F
          gh release download "$TAG" --pattern SHA256SUMS.txt --clobber
          grep -v -E ' (WaveHub-[^ ]*-setup-x64\.exe|WaveHub-[^ ]*-windows-x64\.zip|WaveHub\.exe)$' SHA256SUMS.txt > sums.new || true
          sha256sum $F >> sums.new
          sort -k2 sums.new > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" --clobber SHA256SUMS.txt
