name: Flatpak

# Builds the Flatpak bundle for Linux x86_64 from packaging/flatpak/.
# Run it by hand for the build, or let Release call it. It uploads artifacts only.
# It does not attach files or rewrite SHA256SUMS.txt; Release does that once.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "ver=$v" >> "$GITHUB_OUTPUT"
          echo "Wave Hub $v"

      - name: Check the manifest points at this version
        run: |
          MANIFEST=packaging/flatpak/io.github.postmanpat_303.WaveHub.yml
          grep -q "tag: v${{ steps.ver.outputs.ver }}$" "$MANIFEST" \
            || { echo "::error::$MANIFEST does not pin tag v${{ steps.ver.outputs.ver }}"; exit 1; }

      - name: Install Flatpak and the SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build the bundle
        run: |
          MANIFEST=packaging/flatpak/io.github.postmanpat_303.WaveHub.yml
          VER="${{ steps.ver.outputs.ver }}"
          # --build-only + build-finish + build-export skips flatpak-builder's AppStream
          # compose step, which the newer freedesktop SDK no longer ships appstream-compose for.
          flatpak-builder --user --force-clean --build-only --state-dir=.flatpak-builder build-dir "$MANIFEST"
          flatpak build-finish --command=wave-hub --share=network --share=ipc \
            --socket=wayland --socket=fallback-x11 --device=dri --filesystem=home build-dir
          flatpak build-export --arch=x86_64 repo build-dir
          flatpak build-bundle --arch=x86_64 repo \
            "WaveHub-$VER-linux-x86_64.flatpak" io.github.postmanpat_303.WaveHub
          # The versionless copy is what the website's "latest" link points at.
          cp "WaveHub-$VER-linux-x86_64.flatpak" "WaveHub-linux-x86_64.flatpak"

      - uses: actions/upload-artifact@v4
        with:
          name: wavehub-flatpak
          path: WaveHub*.flatpak
          if-no-files-found: error
