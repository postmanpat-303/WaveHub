[package]
name = "wave-hub"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Derek Heasley"]
description = "Wave Hub: install, update and open BigWave Radio, ChipWave Tracker and StreamWave"
repository = "https://github.com/postmanpat-303/WaveHub"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
